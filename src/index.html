<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Barlow — the typeface the SymmetrE vector board and point-detail dialog
       are drawn in (matches the CTA BMS design reference) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Tailwind config for BMS-specific colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bms-dark': '#1a1a2e',
            'bms-panel': '#16213e',
            'bms-accent': '#0f3460',
            'bms-cyan': '#00BFFF',
            'bms-amber': '#FFA500',
            'bms-charcoal': '#2d2d2d',
          },
          animation: {
            'bms-flash': 'bms-flash 0.8s ease-in-out infinite',
          },
          keyframes: {
            'bms-flash': {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.15' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Minimal base styles for BMS aesthetic */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* SymmetrE vector board motion — airflow dashes, fan wheels, alarm
       emphasis. Referenced from SymmetreBoard.jsx / boardArt.js. */
    @keyframes dashmove { to { stroke-dashoffset: -40; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bms-blink { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    /* Alarm-icon blink. AlarmIcon.jsx appends `animate-bms-flash` for every state
       the SME legend calls "blinking"; that looks like a Tailwind arbitrary
       utility, but this page loads a PREBUILT Tailwind and the JIT config script
       does not run, so no animate-* utility can be generated and the class was
       resolving to nothing at all. Every "blinking" icon therefore rendered
       static, which made filled-blinking and filled-steady identical and defeated
       the legend. Defined here as a real rule instead.

       A hard on/off rather than the softer bms-blink pulse: at 16px an opacity
       dip to .4 is easy to miss, and the whole point is that an unacknowledged
       alarm is unmissable. steps(1, end) gives a square wave at ~1Hz. */
    @keyframes bms-flash { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }
    .animate-bms-flash { animation: bms-flash 1s steps(1, end) infinite; }
    @keyframes bms-ring {
      0%, 100% { box-shadow: 0 0 0 2px #e0342b; }
      50% { box-shadow: 0 0 0 4px rgba(224,52,43,.35); }
    }

    /* ── Controls sidebar palette (tokens in ui/symmetre/panelTheme.js) ──
       Light neutral panel + blue section bars + navy values, matching the
       CTA BMS design reference's left control panel. */
    .cta-row {
      color: #3f5170;
      border-bottom: 1px solid #d8e1ee;
    }
    .cta-row:nth-of-type(even) { background: rgba(255, 255, 255, .38); }
    .cta-row--click { cursor: pointer; }
    .cta-row--click:hover { background: #dde7f4; }
    .cta-val { color: #12294f; }
    .cta-unit { color: #5a6f8e; font-weight: 700; }
    .cta-head-title { color: #eef3fa; letter-spacing: .2px; }
    .cta-box {
      background: #fff;
      border: 1.5px solid #8496b4;
      border-radius: 4px;
      box-shadow: inset 0 1px 2px rgba(30, 50, 90, .1);
      color: #12294f;
      font-weight: 700;
      text-align: right;
    }
    .cta-box--edit {
      border-color: #2d5aa8;
      box-shadow: 0 0 0 2px rgba(45, 90, 168, .18);
      outline: none;
    }
    .cta-pill {
      border-radius: 5px;
      color: #fff;
      font-weight: 800;
      letter-spacing: .3px;
      text-shadow: 0 1px 1px rgba(10, 25, 50, .28);
    }
    .cta-pill--on { background: linear-gradient(180deg, #5fd694, #22a35d); border: 1px solid #9ff0c2; }
    .cta-pill--off { background: linear-gradient(180deg, #8d9cb4, #68788f); border: 1px solid #b8c3d3; }
    .cta-pill--alarm { background: linear-gradient(180deg, #e88f88, #c0332b); border: 1px solid #eeaba4; }

    /* The AHU-23-1 artwork ships with a baked-in static value layer from its
       source file; the live chips replace it. */
    #ahu-board #values,
    #ahu-board #valueBoxes,
    #ahu-board #pumpStatusBaked,
    #ahu-board use[href="#greenBlk2"] { display: none; }

    /* Alarm Summary grid — fixed columns keep their width and the grid scrolls
       sideways on a narrow window rather than collapsing to ellipses.
       width:max-content makes each row's box span ALL its columns, so the row
       and header backgrounds paint under the rightmost columns instead of
       stopping at the viewport edge; min-width:100% still fills a wide window. */
    .alarm-grid,
    .alarm-rows { width: max-content; min-width: 100%; }
    .alarm-grid > div { flex-shrink: 0; }

    /* ── Left controls panel ────────────────────────────────────────────
       Presentation-only pass over the existing sidebars (ControlsSidebar,
       AHU44New/AHU46/AHU23/VAV variants). Every row, label, value and control
       still comes from those components — this only restyles them to the
       SymmetrE design reference. Selectors match the exact utility-class
       combinations those row components emit, so the dark LL97 card that also
       lives in this column is untouched. */
    .sym-panel {
      background: linear-gradient(180deg, #eef2f8, #e4eaf3) !important;
      border-right: 1px solid #b9c4d6 !important;
      font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif;
      color: #33455f;
    }

    /* Panel title bar ("Controls — AHU-4-6") */
    .sym-panel > div:first-child > div:first-child {
      background: linear-gradient(180deg, #2b3a52, #243247) !important;
      min-height: 28px;
      padding: 0 10px !important;
    }
    .sym-panel > div:first-child > div:first-child span,
    .sym-panel > div:first-child > div:first-child h2 {
      color: #fff !important;
      font-size: 12.5px !important;
      font-weight: 700 !important;
    }
    .sym-panel > div:first-child > div:first-child button { color: #9fb0c9 !important; }

    /* Section headers */
    .sym-panel .bg-blue-600 {
      background: linear-gradient(180deg, #3f6fbf, #30528e) !important;
      color: #fff !important;
      font-size: 11.5px !important;
      font-weight: 800 !important;
      letter-spacing: .5px;
      padding: 4px 10px !important;
      border-top: 1px solid #5f8bce;
    }

    /* Value rows */
    .sym-panel .justify-between.cursor-pointer,
    .sym-panel .cursor-pointer.justify-between {
      min-height: 26px;
      padding: 3px 10px !important;
      font-size: 11.5px !important;
      color: #33455f !important;
      border-bottom: 1px solid rgba(150, 170, 200, .28);
    }
    .sym-panel .justify-between.cursor-pointer:hover { background: #e4ecf7 !important; }

    /* Value chips — white box = editable, grey box = read-only/commanded */
    .sym-panel .font-mono.rounded.border {
      height: 21px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 46px;
      padding: 0 6px !important;
      background: #fff !important;
      border: 1.5px solid #8496b4 !important;
      border-radius: 4px !important;
      box-shadow: inset 0 1px 2px rgba(30, 50, 90, .1);
      font-family: 'Barlow', 'Segoe UI', sans-serif !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      color: #12294f !important;
    }
    .sym-panel .justify-between > span:last-child {
      font-size: 11px !important;
      font-weight: 800;
      color: #12294f;
    }
    .sym-panel input[type="number"],

      background: #fff !important;
      border: 1.5px solid #2d6fd0 !important;
      border-radius: 4px !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      color: #12294f !important;

    .sym-panel select {
      background: #fff !important;

      border-radius: 3px !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      color: #12294f !important;

    /* Action buttons (Alarm Reset etc.) — bg-gray-100 is the AHU-23-1 sidebar's
       RESET, bg-gray-200 the other three sidebars' */
    .sym-panel .bg-gray-200,
    .sym-panel .bg-gray-100 {

      font-weight: 800 !important;
      letter-spacing: .3px;
      text-shadow: 0 1px 1px rgba(10, 25, 50, .3);

    .sym-panel .cta-pill--alarm,
    .sym-panel .justify-between > span:last-child.cta-pill--alarm {

      background: linear-gradient(180deg, #d3453a, #a4241b) !important;

  <!-- Load POINT_CATALOG + TMY3 weather data, initialize PointRegistry, wire SimulationEngine -->
  <script type="module">
    import { POINT_CATALOG } from './data/points/index.js';
    import { TMY3 } from './data/weather/tmy3_central_park.js';

    // Expose on window for TMY3Projector and other consumers
    window.POINT_CATALOG = POINT_CATALOG;
    window.TMY3_DATA = TMY3;

    // Wait for DOM + Babel scripts to finish before bootstrapping
    function bootstrap() {
      // 1. Initialize PointRegistry with catalog data
      if (window.PointRegistry && window.POINT_CATALOG) {
        window.PointRegistry.initialize(window.POINT_CATALOG);

        // Seed React context with the initialized registry
        if (window.setPointRegistryState) {
          window.setPointRegistryState({
            points: window.PointRegistry.points,
            getValue: window.PointRegistry.getValue,
            setValue: window.PointRegistry.setValue,
            subscribe: window.PointRegistry.subscribe,
            unsubscribe: window.PointRegistry.unsubscribe,
          });
        }
      }

      // 2. Wire SimulationEngine tick → PointRegistry.interpolate + context update
      if (window.SimulationEngine && window.PointRegistry) {
        var lastAccumulatedRow = 0; // Track last row for LL97 hourly accumulation

        window.SimulationEngine.onTick(function (event) {
          // Interpolate all point values to current position
          window.PointRegistry.interpolate(event.rowIndex, event.interpolationFraction);

          // Live weather for AHU-23-1/AHU-4-4/AHU-4-6 is now pushed exclusively
          // through each controller's own updateFromTMY3() (see App.jsx's tick
          // handler) instead of here. This block used to call .setValue()
          // directly, which — unlike updateFromTMY3() — always overwrites and
          // always (re-)marks the point Manual regardless of any existing
          // override, so it silently fought the Manual Weather Control panel
          // (checklist Section C): an instructor's "Winter" override on
          // AHU-23-1/AHU-4-4 would hold for a moment and then get stomped back
          // to the live TMY value on the very next tick. AHU-4-6 was never
          // included in this block, which is exactly why it never had this
          // problem. Removed rather than guarded, since updateFromTMY3() on
          // all three controllers now does this job correctly.

          // LL97 Accumulator: tick once per simulated hour (when row advances)
          if (window.LL97Accumulator && event.rowIndex > lastAccumulatedRow) {
            // Accumulate for each hour that passed
            while (lastAccumulatedRow < event.rowIndex) {
              lastAccumulatedRow++;
              var outdoorTemp = null;
              if (window.TMY3Projector && window.TMY3Projector.getWeatherForRow) {
                var weather = window.TMY3Projector.getWeatherForRow(lastAccumulatedRow);
                if (weather) outdoorTemp = weather.dryBulb;
              }
              window.LL97Accumulator.tick({ outdoorTemp: outdoorTemp });
            }
          }

          // Update React SimulationContext so UI re-renders (ZoneTabs OA strip, etc.)
          if (window.setSimulationState) {
            window.setSimulationState({
              currentRow: event.rowIndex,
              speed: window.SimulationEngine.speed,
              interpolationFraction: event.interpolationFraction,
            });
          }
        });

        // 3. Start the engine at default speed
        window.SimulationEngine.setSpeed('60x');
        window.SimulationEngine.start();
      }
    }

    // Module scripts run deferred, but Babel-transformed scripts may still be pending.
    // Retry until React app mounts and exposes state setters on window.
    // 40 files are transformed client-side by in-browser Babel before the app
    // mounts — on a slower machine or cold cache this can take a while, so the
    // retry budget is generous (up to 40s) rather than giving up early and
    // silently leaving the simulation clock (window.SimulationEngine) never
    // started.
    function tryBootstrap(attempts) {
      if (window.setPointRegistryState && window.setSimulationState) {
        bootstrap();
      } else if (attempts < 200) {
        setTimeout(function () { tryBootstrap(attempts + 1); }, 200);
      } else {
        console.warn('[BMS Bootstrap] Timed out waiting for React app to mount after 40s. ' +
          'The simulation clock was not started. This usually means a script error ' +
          'occurred earlier during page load — check the console above for the first ' +
          'red error, or try a hard refresh (Cmd/Ctrl+Shift+R).');
      }
    }

    if (document.readyState === 'complete') {
      setTimeout(function () { tryBootstrap(0); }, 200);
    } else {
      window.addEventListener('load', function () {
        setTimeout(function () { tryBootstrap(0); }, 200);
      });
    }
  </script>

  <!-- Main application entry — Babel transforms JSX to React.createElement calls -->
  <script type="text/babel" src="App.jsx"></script>

  <!-- ── JSX loader fallback ───────────────────────────────────────────────
       @babel/standalone normally fetches and runs every
       <script type="text/babel" src="…"> above by itself. Some hosts block the
       blob:/inline <script> it injects for the compiled output, which silently
       leaves every JSX module unloaded and #root empty.

       This runs only in that case: if App.jsx never defined window.App, it
       fetches the same files, in the same order, transforms them with the Babel
       that is already on the page, and executes them. Nothing about the file
       layout or the tags above changes — this is purely a delivery fallback. -->
  <script>
    (function () {
      function loadFallback() {
        if (window.App || !window.Babel) return;
        var tags = Array.prototype.slice.call(
          document.querySelectorAll('script[type="text/babel"][src]'));
        console.info('[BMS Bootstrap] Babel did not execute the JSX modules; ' +
          'loading ' + tags.length + ' of them directly.');
        var i = 0;
        function next() {
          if (i >= tags.length) return;
          var src = tags[i++].getAttribute('src');
          fetch(src)
            .then(function (r) { return r.text(); })
            .then(function (code) {
              var out = window.Babel.transform(code, { presets: ['react'] }).code;
              try { (new Function(out))(); }
              catch (e) { console.error('[BMS Bootstrap] ' + src + ': ' + e.message); }
            })
            .catch(function (e) { console.error('[BMS Bootstrap] ' + src + ': ' + e.message); })
            .then(next);
        }
        next();
      }
      if (document.readyState === 'complete') setTimeout(loadFallback, 400);
      else window.addEventListener('load', function () { setTimeout(loadFallback, 400); });
    })();
  </script>
